<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cornertime Custom Punishment Generator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fff1f2',
              100: '#ffe4e6',
              500: '#f43f5e',
              600: '#e11d48',
              700: '#be123c',
              900: '#881337',
              950: '#4c0519'
            }
          }
        }
      }
    }
  </script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Custom scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #111827;
    }
    ::-webkit-scrollbar-thumb {
      background: #374151;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col justify-between">

  <!-- Main Container -->
  <div class="max-w-4xl mx-auto px-4 py-8 w-full">
    
    <!-- Header -->
    <header class="text-center mb-8">
      <div class="inline-flex items-center justify-center p-3 bg-brand-900/30 text-brand-500 rounded-2xl mb-4 ring-1 ring-brand-500/20">
        <i class="fa-solid fa-hourglass-half text-3xl"></i>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight text-white mb-2">
        Cornertime Punishment Generator
      </h1>
      <p class="text-slate-400 max-w-lg mx-auto text-sm sm:text-base">
        Set the criteria for an appropriate punishment session. The result is securely encrypted into a unique Cornertime code.
      </p>

      <!-- Global Generation Counter Badge -->
      <div class="mt-4 inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs font-medium text-slate-400">
        <i class="fa-solid fa-bolt text-amber-400"></i>
        <span>Total Generated:</span>
        <span id="counterDisplay" class="text-white font-bold">--</span>
      </div>
    </header>

    <!-- Generator Form Container -->
    <div class="bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-2xl p-6 sm:p-8 shadow-2xl">
      <form id="punishmentForm" onsubmit="event.preventDefault(); generateCode();" class="space-y-6">
